apiVersion: functions.oci.upbound.io/v1alpha1
kind: Function
metadata:
  annotations:
    meta.upbound.io/example-id: functions/v1alpha1/function
  labels:
    testing.upbound.io/example-name: test_function
  name: test-function
spec:
  forProvider:
    applicationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_application
    config: ${var.function_config}
    definedTags:
      Operations.CostCenter: "42"
    detachedModeTimeoutInSeconds: ${var.function_detached_mode_timeout_in_seconds}
    displayName: ${var.function_display_name}
    failureDestination:
    - channelIdSelector:
        matchLabels:
          testing.upbound.io/example-name: test_channel
      kind: ${var.function_failure_destination_kind}
      queueIdSelector:
        matchLabels:
          testing.upbound.io/example-name: test_queue
      streamIdSelector:
        matchLabels:
          testing.upbound.io/example-name: test_stream
      topicIdSelector:
        matchLabels:
          testing.upbound.io/example-name: test_notification_topic
    freeformTags:
      Department: Finance
    memoryInMbs: ${var.function_memory_in_mbs}
    provisionedConcurrencyConfig:
    - count: ${var.function_provisioned_concurrency_config_count}
      strategy: ${var.function_provisioned_concurrency_config_strategy}
    sourceDetails:
    - archiveSourceDetails:
      - archiveFile: ${var.function_source_details_archive_source_details_archive_file}
        archiveSourceType: ${var.function_source_details_archive_source_details_archive_source_type}
        bucket: ${var.function_source_details_archive_source_details_bucket}
        namespace: ${var.function_source_details_archive_source_details_namespace}
        object: ${var.function_source_details_archive_source_details_object}
        objectVersionId: ${oci_objectstorage_object_version.test_object_version.id}
      handler: ${var.function_source_details_handler}
      image: ${var.function_source_details_image}
      imageDigest: ${var.function_source_details_image_digest}
      pbfListingId: ${oci_functions_pbf_listing.test_pbf_listing.id}
      runtimeConfig:
      - functionsRuntimeName: ${var.functions_runtime_name}
        functionsRuntimeVersionId: ${var.functions_runtime_version_id}
        runtimeConfigType: ${var.function_source_details_runtime_config_runtime_config_type}
      sourceType: ${var.function_source_details_source_type}
    successDestination:
    - channelIdSelector:
        matchLabels:
          testing.upbound.io/example-name: test_channel
      kind: ${var.function_success_destination_kind}
      queueIdSelector:
        matchLabels:
          testing.upbound.io/example-name: test_queue
      streamIdSelector:
        matchLabels:
          testing.upbound.io/example-name: test_stream
      topicIdSelector:
        matchLabels:
          testing.upbound.io/example-name: test_notification_topic
    timeoutInSeconds: ${var.function_timeout_in_seconds}
    traceConfig:
    - isEnabled: ${var.function_trace_config_is_enabled}
