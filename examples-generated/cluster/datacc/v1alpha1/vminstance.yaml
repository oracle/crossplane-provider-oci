apiVersion: datacc.oci.upbound.io/v1alpha1
kind: VmInstance
metadata:
  annotations:
    meta.upbound.io/example-id: datacc/v1alpha1/vminstance
  labels:
    testing.upbound.io/example-name: test_vm_instance
  name: test-vm-instance
spec:
  forProvider:
    bootStorageSizeInGbs: ${var.vm_instance_boot_storage_size_in_gbs}
    compartmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    cpusEnabled: ${var.vm_instance_cpus_enabled}
    dataStorageSizeInGb: ${var.vm_instance_data_storage_size_in_gb}
    definedTags:
      foo-namespace.bar-key: value
    description: ${var.vm_instance_description}
    displayName: ${var.vm_instance_display_name}
    dnsServers: ${var.vm_instance_dns_servers}
    domainNameSelector:
      matchLabels:
        testing.upbound.io/example-name: test_domain
    freeformTags:
      bar-key: value
    gateway: ${var.vm_instance_gateway}
    hostname: ${var.vm_instance_hostname}
    imageIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_image
    infrastructureIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_infrastructure
    ipAddress: ${var.vm_instance_ip_address}
    memorySizeInGbs: ${var.vm_instance_memory_size_in_gbs}
    metadata: ${var.vm_instance_metadata}
    netmask: ${var.vm_instance_netmask}
    ntpServers: ${var.vm_instance_ntp_servers}
    serverId: ${oci_datacc_server.test_server.id}
    sshPublicKeys: ${var.vm_instance_ssh_public_keys}
    systemTags: ${var.vm_instance_system_tags}
    timeZone: ${var.vm_instance_time_zone}
    userdata: ${var.vm_instance_userdata}
    vlanIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_vlan
    vmNetworkId: ${oci_datacc_vm_network.test_vm_network.id}
