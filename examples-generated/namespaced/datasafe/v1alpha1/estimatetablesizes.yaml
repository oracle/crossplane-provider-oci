apiVersion: datasafe.oci.m.upbound.io/v1alpha1
kind: EstimateTableSizes
metadata:
  annotations:
    meta.upbound.io/example-id: datasafe/v1alpha1/estimatetablesizes
  labels:
    testing.upbound.io/example-name: test_estimate_table_sizes
  name: test-estimate-table-sizes
  namespace: upbound-system
spec:
  forProvider:
    subsettingPolicyIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_subsetting_policy
    targetCredentials:
    - passwordSecretRef:
        key: example-key
        name: example-secret
      userName: ${var.target_database_user_name}
    targetId: ${var.target_id}
