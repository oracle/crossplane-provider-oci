apiVersion: networking.oci.upbound.io/v1alpha1
kind: Vcn
metadata:
  annotations:
    meta.upbound.io/example-id: containerengine/v1alpha1/nodepool
  labels:
    testing.upbound.io/example-name: test_vcn
  name: test-vcn
spec:
