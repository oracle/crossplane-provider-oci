apiVersion: dns.oci.upbound.io/v1alpha1
kind: Rrset
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/rrset
  labels:
    testing.upbound.io/example-name: record-txt
  name: record-txt
spec:
  forProvider:
    domain: ${data.oci_identity_tenancy.tenancy.name}-${random_string.random_prefix.result}-tf-example-primary.oci-dns1
    items:
    - domain: ${data.oci_identity_tenancy.tenancy.name}-${random_string.random_prefix.result}-tf-example-primary.oci-dns1
      rdata: v=spf1 include:spf.oracleemaildelivery.com -all
      rtype: TXT
      ttl: 86400
    rtype: TXT
    zoneNameOrId: ${data.oci_identity_tenancy.tenancy.name}-${random_string.random_prefix.result}-tf-example-primary.oci-dns1

---

apiVersion: dns.oci.upbound.io/v1alpha1
kind: Zone
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/rrset
  labels:
    testing.upbound.io/example-name: zone1
  name: zone1
spec:
  forProvider:
    compartmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: ${data.oci_identity_compartment.compartment.name}2-tf-example-primary.oci-email-dns
    zoneType: PRIMARY
