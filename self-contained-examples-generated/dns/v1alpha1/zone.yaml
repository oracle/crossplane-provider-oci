apiVersion: dns.oci.upbound.io/v1alpha1
kind: Zone
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/zone
  labels:
    testing.upbound.io/example-name: zone1
  name: zone1
spec:
  forProvider:
    compartmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: ${data.oci_identity_tenancy.tenancy.name}-${random_string.random_prefix.result}-tf-example-primary.oci-dns1
    scope: PRIVATE
    viewIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_view
    zoneType: PRIMARY

---

apiVersion: dns.oci.upbound.io/v1alpha1
kind: View
metadata:
  annotations:
    meta.upbound.io/example-id: dns/v1alpha1/zone
  labels:
    testing.upbound.io/example-name: test_view
  name: test-view
spec:
  forProvider:
    compartmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    scope: PRIVATE
