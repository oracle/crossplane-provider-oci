apiVersion: compute.oci.upbound.io/v1alpha1
kind: InstanceConsoleConnection
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/instanceconsoleconnection
  labels:
    testing.upbound.io/example-name: test_instance_console_connection
  name: test-instance-console-connection
spec:
  forProvider:
    instanceId: ${oci_core_instance.test_instance.id}
    publicKey: ${var.ssh_public_key}

---

apiVersion: compute.oci.upbound.io/v1alpha1
kind: Instance
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/instanceconsoleconnection
  labels:
    testing.upbound.io/example-name: test_instance
  name: test-instance
spec:
  forProvider:
    availabilityDomain: ${data.oci_identity_availability_domain.ad.name}
    compartmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    createVnicDetails:
    - assignPublicIp: true
      displayName: Primaryvnic
      hostnameLabel: testinstance
      subnetIdSelector:
        matchLabels:
          testing.upbound.io/example-name: test_subnet
    displayName: TestInstance
    metadata:
      ssh_authorized_keys: ${var.ssh_public_key}
    shape: ${var.instance_shape}
    sourceDetails:
    - sourceIdSelector:
        matchLabels:
          testing.upbound.io/example-name: instance_image_ocid[var
      sourceType: image
    timeouts:
    - create: 60m

---

apiVersion: networking.oci.upbound.io/v1alpha1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/instanceconsoleconnection
  labels:
    testing.upbound.io/example-name: test_subnet
  name: test-subnet
spec:
  forProvider:
    availabilityDomain: ${data.oci_identity_availability_domain.ad.name}
    cidrBlock: 10.1.20.0/24
    compartmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    dhcpOptionsIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_vcn
    displayName: TestSubnet
    dnsLabel: testsubnet
    routeTableIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_vcn
    securityListIdRefs:
    - name: test_vcn
    vcnIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_vcn

---

apiVersion: networking.oci.upbound.io/v1alpha1
kind: Vcn
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/instanceconsoleconnection
  labels:
    testing.upbound.io/example-name: test_vcn
  name: test-vcn
spec:
  forProvider:
    cidrBlock: 10.1.0.0/16
    compartmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    displayName: TestVcn
    dnsLabel: testvcn
