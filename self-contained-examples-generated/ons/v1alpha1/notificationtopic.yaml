apiVersion: ons.oci.upbound.io/v1alpha1
kind: NotificationTopic
metadata:
  annotations:
    meta.upbound.io/example-id: ons/v1alpha1/notificationtopic
  labels:
    testing.upbound.io/example-name: test_notification_topic
  name: test-notification-topic
spec:
  forProvider:
    compartmentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    definedTags:
      ${oci_identity_tag_namespace.tag_namespace1.name}.${oci_identity_tag.tag1.name}: ${var.notification_topic_defined_tags_value}
    description: ${var.notification_topic_description}
    freeformTags: ${var.notification_topic_freeform_tags}
    name: ${random_string.topicname.result}
